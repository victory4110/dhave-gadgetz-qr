<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }

        .qr-wrapper {
            background: white;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .qr-wrapper:hover {
            transform: scale(1.02);
        }

        canvas {
            border-radius: 12px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hint {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.7rem;
            margin-top: 1.5rem;
            font-family: sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div class="qr-wrapper" id="qr-container">
        <canvas id="qr"></canvas>
    </div>
    <div class="hint">Click QR to Save</div>

    <div id="ip-warning"
        style="display:none; margin-top: 3rem; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); padding: 1.5rem; border-radius: 16px; max-width: 400px; font-size: 0.85rem; color: #f87171; line-height: 1.5;">
        <strong>⚠️ Localhost Warning</strong><br>
        Your phone cannot scan a "localhost" QR code.
        Please access this page using your computer's IP address (e.g. <code>http://192.168.x.x:3000</code>) to generate
        an active QR for your phone.
    </div>

    <script>
        const canvas = document.getElementById('qr');

        // Check for localhost and show warning
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            document.getElementById('ip-warning').style.display = 'block';
        }
        function init() {
            // Points to DHAVEKLEANZ details endpoint
            const url = `${window.location.origin}/api/pay/5199540974`;

            QRCode.toCanvas(canvas, url, {
                width: 380,
                margin: 0,
                color: { dark: '#000000', light: '#ffffff' }
            });
        }

        document.getElementById('qr-container').onclick = () => {
            const link = document.createElement('a');
            link.download = 'DHAVEGADGETZ-QR.png';
            link.href = canvas.toDataURL();
            link.click();
        };

        init();
    </script>
</body>

</html>
