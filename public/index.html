<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHAVE GADGETZ QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <style>
        body {
            background: #000;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .q {
            background: #fff;
            padding: 25px;
            border-radius: 35px;
            box-shadow: 0 0 60px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            transition: 0.3s;
        }

        .q:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body>
    <div class="q" id="c"><canvas id="qr"></canvas></div>
    <script>
        const canvas = document.getElementById('qr');
        // Points to the detail fetcher API
        QRCode.toCanvas(canvas, `${window.location.origin}/api/pay/5199540974`, { width: 380, margin: 0 });
        document.getElementById('c').onclick = () => {
            const link = document.createElement('a');
            link.download = 'DHAVEGADGETZ-QR.png';
            link.href = canvas.toDataURL();
            link.click();
        };
    </script>
</body>

</html>
