<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Payment | QR Pay</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 100% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .icon {
            width: 60px;
            height: 60px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: var(--primary);
            font-size: 1.5rem;
        }

        h2 {
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .bank-details {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .bank-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 5px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="card" id="main-content">
        <div class="icon">💸</div>
        <h2 id="merchant-name">...</h2>
        <div class="bank-details">
            <span id="merchant-acc">...</span><br>
            <span class="bank-badge" id="merchant-bank">...</span>
        </div>

        <form id="pay-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            <div class="input-group" id="amount-group">
                <label>Amount (NGN)</label>
                <input type="number" id="amount" placeholder="5,000" min="100">
            </div>
            <button type="submit" id="pay-btn">
                <span id="btn-text">Pay Now</span>
                <div class="loader" id="loader"></div>
            </button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const reference = urlParams.get('ref');

        async function loadDetails() {
            if (!reference) return document.body.innerHTML = "Invalid URL";

            try {
                const res = await fetch(`/api/accounts/transaction/${reference}`);
                const { data } = await res.json();

                document.getElementById('merchant-name').textContent = data.accountName;
                document.getElementById('merchant-acc').textContent = data.accountNumber;
                document.getElementById('merchant-bank').textContent = data.bank;

                if (data.amount) {
                    document.getElementById('amount-group').style.display = 'none';
                    document.getElementById('amount').value = data.amount / 100;
                    document.getElementById('btn-text').textContent = `Pay ₦${data.amount / 100}`;
                }
            } catch (err) { console.error(err); }
        }

        document.getElementById('pay-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('pay-btn');
            const text = document.getElementById('btn-text');
            const loader = document.getElementById('loader');

            btn.disabled = true;
            text.style.display = 'none';
            loader.style.display = 'block';

            const amount = document.getElementById('amount').value;
            const email = document.getElementById('email').value;

            // Redirect to the processing endpoint with query params
            window.location.href = `/api/pay/process/${reference}?amount=${amount}&email=${email}`;
        };

        loadDetails();
    </script>
</body>

</html>
